# environment refers to either of "onPrem" "saas" "marketPlace"
# "saas" "marketPlace" are used by Kinetica only
# for a customer trying to install the chart on his own wherever, it should be onPrem
environment: ""
# onPrem Providers: "k3s" "kind" "eks" "aks"
# saas Providers: eks
# marketPlace Providers: aks eks
provider: ""

# clusterName and clusterRegion are used only when environment is marketPlace and provider is eks
# clusterName alone is used if you are using dedicated-saas eks, this value is used to create a named StorageClass
# its used in the monitoring related configmaps
clusterName: ""
clusterRegion: ""
letsEncryptEmail: devops@kinetica.com
createNamespaces: true

global:
  defaultStorageClass: ""
  kineticaClusterName: ""  # Set to cluster name for sub-path multi-tenancy SPP routing
  image:
    registry: &imageRegistry "REPLACEMEREGISTRY"
    tag: &imageTag "REPLACEMETAG"

upsertKineticaCrds:
  enabled: false
  installRbac: false
  # serviceAccountName: run the upsert Job as this ServiceAccount instead of the
  # operator's (dbOperator.serviceAccountName, default controller-manager). When
  # set to a name that differs from the operator's SA, the chart also creates it
  # as a pre-install hook (weight -10) so the knob is self-sufficient on fresh
  # installs; when the two resolve to the same name the operator RBAC already
  # defines it. Set on Rubix to kineticacluster-operator so the
  # platform-provisioned CRD-update ClusterRoleBinding subject keeps matching
  # across the controller-manager rename.
  serviceAccountName: ""
  # failOnError: strict by default — any CRD check/replace failure (including
  # Forbidden) fails the install/upgrade. Set false only where partial failures
  # are expected and tolerated (e.g. the Rubix sandbox, whose platform CRD grant
  # is a resourceNames allow-list bound to the original install namespace).
  failOnError: true
  image:
    repository: "upsert-kinetica-crds"
    tag: *imageTag

# persistPvcResize:
#   # Pre-upgrade Job patches persist-tier PVCs to a new size and waits for CSI
#   # to finish resizing. Post-upgrade Job restarts the DB pods so they pick up
#   # the new disk size from the regenerated gpudb.conf. Idempotent: a no-op
#   # run writes a "noop" sentinel and skips the pod restart on the next upgrade.
#   #
#   # Reuses the upsertKineticaCrds image (above) since it ships kubectl.
#   # See templates/persist-pvc-resize.tpl for full docs and escape-hatch overrides.
#   enabled: false
#   # namespace: gpudb               # defaults to kineticacluster.namespace
#   # size: "150Gi"                  # defaults to persistTier.default.limit
#   # pvcNames: []                   # defaults to <clusterName>-persist-gpudb-<N>
#   # dbPodNames: []                 # defaults to gpudb-<N>

# One-shot deletion of explicitly named PVCs before a fresh install (e.g. stale
# StatefulSet PVCs surviving a previous uninstall that a reinstall would rebind).
# Deliberately OFF here — enable ONLY in a per-install deployment overlay with
# an explicit pvcNames list. See templates/pvc-cleanup.tpl.
# NOTE: deletions run sequentially at up to 120s each — with more than 2 PVCs,
# raise helm's --timeout above pvcNames-count × 120s or the release aborts while
# the hook Job keeps deleting.
pvcCleanup:
  enabled: false

kubeStateMetrics:
  install: false
  image:
    repository: "registry.k8s.io/kube-state-metrics/kube-state-metrics"
    tag: "v2.10.1"

otelCollector:
  install: true
  installRbac: false
  image:
    repository: "otel/opentelemetry-collector-contrib"
    tag: "0.95.0"

fluentBit:
  image:
    repository: "fluent-bit"
    tag: *imageTag

wbOperator:
  install: true
  image:
    # registry overrides global.image.registry for this image only; empty falls back to global
    registry: ""
    repository: "workbench-operator"
    tag: *imageTag
    digest: ""
  rbac:
    installClusterRoles:
      # TokenReview/SubjectAccessReview delegation so the operator can authenticate
      # scrapers of its HTTPS metrics endpoint, plus a metrics-reader role to bind
      # scrapers to. Only needed if something scrapes operator metrics.
      metricsAuth: false

dbOperator:
  install: true
  # optional: aadpodidbinding is required when environment is marketPlace and provider is aks
  aadpodidbinding: ""
  image:
    # registry overrides global.image.registry for this image only; empty falls back to global
    registry: ""
    repository: "kinetica-k8s-operator"
    tag: *imageTag
    digest: ""
  monitoring:
    type: "otel"
    otel:
      url: "otel-collector.kinetica-system.svc.cluster.local:4317"
  webhooks:
    # Deploy the operator's admission webhooks and their cert-manager objects
    # (Issuer + Certificates + webhook Service + Mutating/Validating configs).
    # Requires cert-manager on the cluster (certManager.install or platform-
    # provided) AND an installer allowed to write cert-manager.io and
    # admissionregistration.k8s.io objects. Set false where that RBAC is
    # unavailable (e.g. Palantir Rubix): the operator then runs with
    # ENABLE_WEBHOOKS=false. All webhook handlers are currently scaffold stubs,
    # so disabling loses no validation — CRD schema validation is unaffected.
    install: true
  rbac:
    installRoles:
      velero: false
    installClusterRoles:
      # Permission to inspect nodes to auto-discover node sizing for databases
      nodes: false
      # Permission to get and create storage classes (auto-generate storage classes with best practice annotations)
      storageClasses: false
      # TokenReview/SubjectAccessReview delegation so the operator can authenticate
      # scrapers of its HTTPS metrics endpoint, plus a metrics-reader role to bind
      # scrapers to. Only needed if something scrapes operator metrics.
      metricsAuth: false

nodeSelector: {}
tolerations: []
affinity: {}

certManager:
  install: true
"cert-manager":
  crds:
    enabled: true
  namespace: kinetica-system
  nodeSelector: {}
  webhook:
    nodeSelector: {}
  cainjector:
    nodeSelector: {}
  startupapicheck:
    nodeSelector: {}

# Uncomment and populate with user supplied certs
# Also set certManager.install to false
# tlsTermination:
#   # certs and keys must be base64 encoded
#   database:
#     certificate: ""
#     privateKey: ""
#   workbench:
#     certificate: ""
#     privateKey: ""

ingressNginx:
  install: true
"ingress-nginx":
  namespaceOverride: "gpudb"
  fullnameOverride: "ingress-nginx"
  tcp: {}
  defaultBackend:
    enabled: true
    image:
      image: "kinetica-default-backend"
      tag: *imageTag
      digest: ""
    nodeSelector: {}
    extraEnvs:
      - name: DEBUG
        value: "false"
  controller:
    image:
      image: "ingress-nginx-controller"
      tag: *imageTag
      digest: ""
      digestChroot: ""
    nodeSelector: {}
    resources:
      requests:
        cpu: 500m
        memory: 512Mi
      limits:
        cpu: 4
        memory: 1Gi
    allowSnippetAnnotations: true
    config:
      annotations-risk-level: Critical
      use-forwarded-headers: "true"
    scope:
      enabled: true
      namespace: "gpudb"
    service:
      annotations: {}
    admissionWebhooks:
      enabled: true
      patch:
        enabled: true
        image:
          repository: k8s.gcr.io/ingress-nginx/kube-webhook-certgen
          tag: v1.1.1
          digest: ""
    watchIngressWithoutClass: true
  rbac:
    create: false
    scope: true

# Static circuit-breaker ingress proxy ("doorman") — the ingress-nginx
# replacement for environments that disallow cluster-wide RBAC and Gateway API
# objects (e.g. Palantir Rubix). Renders only namespaced resources: Deployment +
# Service (carrying any platform annotations) + ConfigMap with the proxy's
# static routing table. No operator, no CRDs, no Kubernetes API access.
doorman:
  install: false
  # Tier-3 probe shielding: while the DB is down and client connections are
  # parked (upstream holds), answer the Kinetica clients' liveness probes from
  # a cached copy of the last healthy response. Lets JDBC/Python drivers
  # survive outages longer than their hard-coded ~5s probe timeout allows
  # (~20 min of failed probes kills an ingest via GPUdbExitException).
  holdShield:
    enabled: false
    # paths: []          # defaults to the two Kinetica probe endpoints
    # maxResponseBytes: 65536
  image:
    # registry overrides global.image.registry for this image only; the
    # circuit-breaker image is published to Docker Hub, not ACR. Tag is
    # pinned: circuit-breaker rides its own branch, not the monorepo release
    # lockstep.
    registry: "docker.io/kinetica"
    repository: circuit-breaker
    tag: "doorman-20260831"
    pullPolicy: IfNotPresent
  imagePullSecrets: []
  # HA default: two replicas behind the one Service, spread across nodes when
  # possible (soft anti-affinity) and protected by a PodDisruptionBudget
  # (minAvailable 1, rendered whenever replicas > 1). Holds and resilience
  # counters are per-replica; front-proxy connection pooling may distribute
  # traffic unevenly — that is expected and harmless.
  replicas: 2
  # External listener. Port must be >=1024 (proxy runs non-root). The Service
  # port is named "https" — SPP-style endpoint discovery matches on it.
  listener:
    port: 8443
    # TLS secret (type kubernetes.io/tls) in the DB namespace. Empty +
    # selfSigned generates a chart self-signed cert (parity with
    # ingress-nginx's built-in fake default cert).
    tlsSecretName: ""
    selfSigned: false
  # Annotations for the doorman Service; values are rendered with tpl, same as
  # the ingress-nginx service annotations.
  service:
    annotations: {}
  # Number of gpudb rank routes to render (rank0..rankN). Empty computes
  # replicas+1 from kineticacluster.gpudbCluster.replicas.
  ranks: ""
  resources: {}
  # Hard anti-affinity: keep doorman replicas off nodes running Kinetica DB
  # (gpudb) pods, so a DB-node drain/restart cannot evict a doorman replica
  # with the database. Requires >=1 node without a DB pod. Leave false on
  # single-node k3s/kind or the doorman stays Pending.
  avoidDBNodes: false
  # Hard replica spread: never co-locate two doorman replicas on one node, so
  # a single node loss cannot take out both. Leave false on single-node
  # clusters or the doorman stays Pending.
  requireReplicaSpread: false

gpuOperator:
  install: false
"gpu-operator":
    mig:
      strategy: single
    driver:
      enabled: true
    toolkit:
      enabled: true

openldap:
  # Deploy the bundled OpenLDAP server (the default LDAP identity provider —
  # see kineticacluster.authentication). Set false together with
  # kineticacluster.authentication.type=Internal on clusters that manage
  # users/roles natively in the database (e.g. Palantir Rubix).
  install: true
  strategy:
    type: Recreate
  containerSecurityContext:
    enabled: true
    allowPrivilegeEscalation: false
    capabilities:
      drop:
      - ALL
    readOnlyRootFilesystem: false
    runAsUser: 1001
    runAsNonRoot: true
    seccompProfile:
      type: RuntimeDefault
  openldapNamespace: "gpudb"
  fullnameOverride: "openldap"
  global:
    ldapPort: 1389
  image:
    registry: ""
    repository: "openldap"
    tag: ""
  initContainers:
    - name: openldap-create-directory-structure
      image: '{{- $registry := .Values.image.registry | default .Values.global.image.registry -}}{{ if $registry }}{{ $registry }}/{{ end }}{{ .Values.image.repository }}:{{ .Values.image.tag | default .Values.global.image.tag }}'
      command:
        [
          "sh",
          "-c",
          "mkdir -p /bitnami/openldap/data",
        ]
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop:
          - ALL
        readOnlyRootFilesystem: true
        runAsUser: 1001
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      volumeMounts:
        - name: data
          mountPath: /bitnami
  env:
    LDAP_BACKEND: "mdb"
    LDAP_ORGANISATION: "Kinetica DB Inc."
    LDAP_DOMAIN: "kinetica.com"
    LDAP_LOG_LEVEL: "128"
  affinity: {}
  podAntiAffinity: {}
  nodeSelector: {}
  persistence:
    enabled: true
    existingClaim: ""
    accessMode: "ReadWriteOnce"
    size: "1Gi"
    storageClass: ""
  livenessProbe:
    enabled: true
  readinessProbe:
    enabled: true
  startupProbe:
    enabled: true
    initialDelaySeconds: 30
    periodSeconds: 10
    timeoutSeconds: 1
    successThreshold: 1
    failureThreshold: 30
  initTLSSecret:
    image:
      registry: *imageRegistry
      repository: openssl
      tag: 3.5.8

supportBundle:
  install: true
"support-bundle":
  image:
    registry: ""
    repository: "support-bundle"
    digest: ""
    pullPolicy: IfNotPresent
    tag: ""
  configMap:
    # NOTE: Should match the 'db.name' of the KineticaCluster you are creating -
    #       affects the filename of the support-bundles that are created to create
    #       additional tracability.
    cluster: ""

kineticacluster:
  install: true
  payAsYouGo: false
  name: ""
  pathPrefix: ""  # Set to cluster name for sub-path routing (mirrors kineticacluster.name)
  namespace: gpudb
  debug: false
  # for environment onPrem, provide the following
  deploymentType:
    type: on_prem
    region: on_prem_local
  autoSuspend:
    enabled: false
  hostManagerMonitor:
    monitorRegistryRepositoryTag:
      registry: ""
      repository: kinetica-k8s-monitor
      tag: ""
    livenessProbe:
      failureThreshold: 30
  # you may use nginx if you want the operator to create the nginx records
  # if you want to manage your own ingress controller/gateway api, provide "none"
  # TODO: As of now, if you want the operator to create nginx records, do the following
  # 1. first install nginx sub chart by providing the release namespace as nginx
  # helm -n nginx install nginx charts/kinetica-operators/charts/ingress-nginx --values values
  # you can refer to the correct ingress-ngix values in the corresponding values file in the operators values files
  # This is needed now as the operator as of now, looks for its nginx in the nginx namespace
  # if you enable ingress-nginx and install the operators, it will install all in the kinetica-system namespace
  ingressController: nginx
  authentication:
    type: LDAP
    ldap:
      baseDN: dc=kinetica,dc=com
      bindDN: cn=admin,dc=kinetica,dc=com
      host: openldap
      isInLocalK8S: true
      isLDAPS: false
      namespace: gpudb
      port: 1389
  supportingImages:
    busybox:
      registry: *imageRegistry
      repository: busybox
      tag: *imageTag
  gadmin:
    isEnabled: true
    containerPort:
      name: gadmin
      protocol: TCP
      containerPort: 8080
  reveal:
    isEnabled: true
    containerPort:
      name: reveal
      protocol: TCP
      containerPort: 8088
  generateIngressRecords: true
  gpudbCluster:
    # this applies if you have labelled node pools for compute
    useTShirt: false
    hasPools: false
    ranksPerNode: 1
    replicas: 1
    # provide an fqdn if you want to use a custom fqdn
    fqdn: "local.kinetica"
    clusterName: "cluster0"
    letsEncrypt:
      enabled: false
      # only allowed values are staging and production
      environment: "staging"
    # Internal placeholder — do not edit. Real license comes from licenseSecretName secret.
    # Exists to satisfy subchart required() validation during template rendering.
    license: "PENDING"
    # Pre-created secret containing the Kinetica license (REQUIRED)
    # The secret must contain a 'license' key with the license string
    # Create with: kubectl create secret generic <name> --from-literal=license=<your-license> -n <db-namespace>
    licenseSecretName: ""  # e.g., "kinetica-operators-kineticalicense"
    # image.repository is "kinetica-k8s-[cpu, cuda]"
    # use cuda image for NVIDIA GPU acceleration
    dbRegistryRepositoryTag:
      registry: ""
      repository: kinetica-k8s-cpu
      tag: ""
    metricsRegistryRepositoryTag:
      registry: ""
      repository: fluent-bit
      tag: ""
    config:
      postgresProxy:
        enablePostgresProxy: true
      kifs:
        enable: true
        mountPoint: /gpudb/kifs
      procs:
        enable: true
      textSearch:
        enableTextSearch: true
      tieredStorage:
        generateStorageClasses: false
        allowAutoSizing: false
        globalTier:
          colocateDisks: true
        persistTier:
          default:
            limit: ""
            provisioner: ""
            volumeClaim:
              spec:
                storageClassName: ""
                accessModes:
                  - "ReadWriteOnce"

dbAdminUser:
  create: true
  # Pre-created secret containing admin credentials (REQUIRED when create: true)
  # The secret must contain 'username' and 'password' keys
  # username allowed pattern: "^(?:(?!^graph$|^admin$|^planner$|^[a-zA-Z0-9-]$).){5,10}$"
  # password allowed pattern: "^(?=.*?[A-Z])(?=.*?[a-z])(?=.*?[0-9])(?=.*?[!@\\#$%^&*]).{12,}$"
  # Create with: kubectl create secret generic <name> --from-literal=username=<user> --from-literal=password=<pass> -n <db-namespace>
  adminUserSecretName: ""  # e.g., "kinetica-operators-kineticaadmincredentials"

workbench:
  install: true
  name: workbench
  namespace: gpudb
  # clusterRef identifies the KineticaCluster this Workbench serves. It is a
  # required field on the Workbench CR (spec.clusterRef.name), so it must be
  # non-empty and must match the KineticaCluster's metadata.name. That name is
  # kineticacluster.name above; when kineticacluster.name is left empty the
  # KineticaCluster subchart defaults its name to "kineticacluster", so mirror
  # that here. Any overlay that changes kineticacluster.name must change this too.
  clusterRef:
    name: "kineticacluster"
  fqdn: "local.kinetica"
  letsEncrypt:
    enabled: false
    environment: "staging"
  nodeSelector: {}
  storageClass: ""
  secureNetwork: false
  pathPrefix: ""  # Set to cluster name for sub-path routing (mirrors kineticacluster.name)
  wbRegistryRepositoryTag:
    registry: ""
    repository: workbench
    tag: ""
  telemetry:
    enabled: false
    segmentApiKey: ""
    intercomAppId: ""

networkPolicies:
  install: false
