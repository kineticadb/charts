suite: coldStorageS3 credentialsFrom
values:
  - __base_values.yaml

tests:
  - it: renders no gpudbCluster env, envFrom or cold tier when unset
    asserts:
      - notExists:
          path: spec.gpudbCluster.env
        template: charts/kineticacluster/templates/kineticacluster.yaml
      - notExists:
          path: spec.gpudbCluster.envFrom
        template: charts/kineticacluster/templates/kineticacluster.yaml
      - notExists:
          path: spec.gpudbCluster.config.tieredStorage.coldStorageTier
        template: charts/kineticacluster/templates/kineticacluster.yaml

  - it: Rubix overlay sets no cold tier and no env passthrough
    values:
      - __base_values.yaml
      - ../values.rubix.yaml
    asserts:
      - notExists:
          path: spec.gpudbCluster.envFrom
        template: charts/kineticacluster/templates/kineticacluster.yaml
      - notExists:
          path: spec.gpudbCluster.config.tieredStorage.coldStorageTier
        template: charts/kineticacluster/templates/kineticacluster.yaml

  - it: renders credentialsFrom under an S3 cold tier when set
    set:
      kineticacluster.gpudbCluster.config.tieredStorage.coldStorageTier:
        coldStorageType: s3
        coldStorageS3:
          bucketName: my-bucket
          region: us-gov-west-1
          credentialsFrom:
            configMapRef:
              name: aws-env-kinetica-cold
    asserts:
      - equal:
          path: spec.gpudbCluster.config.tieredStorage.coldStorageTier.coldStorageType
          value: s3
        template: charts/kineticacluster/templates/kineticacluster.yaml
      - equal:
          path: spec.gpudbCluster.config.tieredStorage.coldStorageTier.coldStorageS3.credentialsFrom
          value:
            configMapRef:
              name: aws-env-kinetica-cold
        template: charts/kineticacluster/templates/kineticacluster.yaml

  - it: renders gpudbCluster.env when set
    set:
      kineticacluster.gpudbCluster.env:
        - name: HTTPS_PROXY
          value: http://proxy.example.com:3128
    asserts:
      - equal:
          path: spec.gpudbCluster.env
          value:
            - name: HTTPS_PROXY
              value: http://proxy.example.com:3128
        template: charts/kineticacluster/templates/kineticacluster.yaml
      - notExists:
          path: spec.gpudbCluster.envFrom
        template: charts/kineticacluster/templates/kineticacluster.yaml
