suite: Doorman ring failover (doorman.ha)
values:
  - __base_values.yaml
set:
  doorman:
    install: true

tests:
  - it: renders no peer, no backupRef, no bare routes and no probe credentials when doorman.ha is unset
    template: kinetica_operators.yaml
    asserts:
      - notMatchRegex:
          path: data["circuitbreaker.yaml"]
          pattern: "peer-rank0|backupRef|readyCheck|value: /gpudb-|strip-bare"
        documentSelector:
          path: metadata.name
          value: test-kc-doorman-config
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: KINETICA_HA_PROBE_AUTH
          any: true
        documentSelector:
          path: spec.template.spec.serviceAccountName
          value: test-kc-doorman

  - it: routes every rank http rule to the peer as backup, gated by a drained probe
    template: kinetica_operators.yaml
    set:
      doorman.ha.enabled: true
      doorman.ha.peer.host: ring-b-ha.example.com
      doorman.ha.readyCheck.secretName: ring-probe-auth
    asserts:
      - matchRegex:
          path: data["circuitbreaker.yaml"]
          pattern: "peer-rank0:\\n\\s*name: peer-rank0\\n\\s*host: ring-b-ha.example.com\\n\\s*ports:\\n\\s*- name: http\\n\\s*port: 8082\\n\\s*transport: HTTP"
        documentSelector:
          path: metadata.name
          value: test-kc-doorman-config
      - matchRegex:
          path: data["circuitbreaker.yaml"]
          pattern: 'readyCheck:\n\s*path: /gpudb-0/show/system/status\n\s*method: POST\n(.*\n)*?\s*authEnv: KINETICA_HA_PROBE_AUTH\n\s*match: "drained\\{7}":\\{7}"drained"'
        documentSelector:
          path: metadata.name
          value: test-kc-doorman-config
      - matchRegex:
          path: data["circuitbreaker.yaml"]
          pattern: "value: /test-kc/gpudb-0\\}\\n\\s*backendRef: rank0\\n\\s*backendPort: http\\n\\s*backupRef: peer-rank0\\n\\s*backupPort: http\\n"
        documentSelector:
          path: metadata.name
          value: test-kc-doorman-config
      - matchRegex:
          path: data["circuitbreaker.yaml"]
          pattern: "value: /test-kc/gpudb-0/hostmanager\\}\\n\\s*backendRef: rank0\\n\\s*backendPort: hostmanager\\n\\s*target: strip-rank0-hostmanager\\n\\s*- matches"
        documentSelector:
          path: metadata.name
          value: test-kc-doorman-config
      - notMatchRegex:
          path: data["circuitbreaker.yaml"]
          pattern: "backendRef: (gadmin|workbench)\\n\\s*backendPort: http\\n(\\s*target: [a-z-]+\\n)?\\s*backupRef"
        documentSelector:
          path: metadata.name
          value: test-kc-doorman-config
      - matchRegex:
          path: data["circuitbreaker.yaml"]
          pattern: "value: /gpudb-1\\}\\n\\s*backendRef: rank1\\n\\s*backendPort: http\\n\\s*backupRef: peer-rank0\\n\\s*backupPort: http\\n\\s*- matches"
        documentSelector:
          path: metadata.name
          value: test-kc-doorman-config
      - matchRegex:
          path: data["circuitbreaker.yaml"]
          pattern: "value: /gpudb-0/hostmanager\\}\\n\\s*backendRef: rank0\\n\\s*backendPort: hostmanager\\n\\s*target: strip-bare-rank0-hostmanager"
        documentSelector:
          path: metadata.name
          value: test-kc-doorman-config
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: KINETICA_HA_PROBE_AUTH
            valueFrom:
              secretKeyRef:
                name: ring-probe-auth
                key: auth
        documentSelector:
          path: spec.template.spec.serviceAccountName
          value: test-kc-doorman

  - it: omits the probe when readyCheck is disabled and fails when it is enabled without a Secret
    template: kinetica_operators.yaml
    set:
      doorman.ha.enabled: true
      doorman.ha.peer.host: ring-b-ha.example.com
      doorman.ha.readyCheck.enabled: false
    asserts:
      - matchRegex:
          path: data["circuitbreaker.yaml"]
          pattern: "backupRef: peer-rank0"
        documentSelector:
          path: metadata.name
          value: test-kc-doorman-config
      - notMatchRegex:
          path: data["circuitbreaker.yaml"]
          pattern: "readyCheck"
        documentSelector:
          path: metadata.name
          value: test-kc-doorman-config

  - it: refuses a gated peer without a probe Secret
    template: kinetica_operators.yaml
    set:
      doorman.ha.enabled: true
      doorman.ha.peer.host: ring-b-ha.example.com
    asserts:
      - failedTemplate:
          errorPattern: "doorman.ha.readyCheck.secretName"

  - it: never fails the SDK discovery calls over to the peer (they must be answered by this cluster or not at all)
    template: kinetica_operators.yaml
    set:
      doorman.ha.enabled: true
      doorman.ha.peer.host: ring-b-ha.example.com
      doorman.ha.readyCheck.secretName: ring-probe-auth
    asserts:
      - matchRegex:
          path: data["circuitbreaker.yaml"]
          pattern: "path: \\{type: Exact, value: /gpudb-0/show/system/status\\}\\n\\s*- path: \\{type: Exact, value: /gpudb-0/show/system/properties\\}\\n\\s*backendRef: rank0\\n\\s*backendPort: http\\n\\s*- matches"
        documentSelector:
          path: metadata.name
          value: test-kc-doorman-config
      - matchRegex:
          path: data["circuitbreaker.yaml"]
          pattern: "path: \\{type: Exact, value: /test-kc/gpudb-0/show/system/status\\}\\n\\s*- path: \\{type: Exact, value: /test-kc/gpudb-0/show/system/properties\\}\\n\\s*backendRef: rank0\\n\\s*backendPort: http\\n\\s*target: strip-rank0-httpd\\n\\s*- matches"
        documentSelector:
          path: metadata.name
          value: test-kc-doorman-config

  - it: renders no discovery-call rules without a peer
    template: kinetica_operators.yaml
    set:
      doorman.ha.enabled: true
    asserts:
      - notMatchRegex:
          path: data["circuitbreaker.yaml"]
          pattern: "type: Exact, value: .*/show/system/"
        documentSelector:
          path: metadata.name
          value: test-kc-doorman-config

  - it: keeps the Service ClusterIP by default
    template: kinetica_operators.yaml
    asserts:
      - equal:
          path: spec.type
          value: ClusterIP
        documentSelector:
          path: spec.ports[0].targetPort
          value: https

  - it: exposes the Service as a LoadBalancer when doorman.service.type says so
    template: kinetica_operators.yaml
    set:
      doorman.service.type: LoadBalancer
      doorman.service.annotations:
        service.beta.kubernetes.io/aws-load-balancer-scheme: internet-facing
    asserts:
      - equal:
          path: spec.type
          value: LoadBalancer
        documentSelector:
          path: spec.ports[0].targetPort
          value: https
      - equal:
          path: metadata.annotations["service.beta.kubernetes.io/aws-load-balancer-scheme"]
          value: internet-facing
        documentSelector:
          path: spec.ports[0].targetPort
          value: https

  - it: trusts the ca.crt of its own TLS Secret for the peer when no CA ConfigMap is named
    template: kinetica_operators.yaml
    set:
      doorman.ha.enabled: true
      doorman.ha.peer.host: ring-b-ha.example.com
      doorman.ha.readyCheck.secretName: ring-probe-auth
      doorman.listener.tlsSecretName: site-tls
    asserts:
      - contains:
          path: spec.template.spec.volumes
          content:
            name: peer-ca
            secret:
              secretName: site-tls
              optional: true
              items:
                - key: ca.crt
                  path: ca.crt
        documentSelector:
          path: spec.template.spec.serviceAccountName
          value: test-kc-doorman
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: SSL_CERT_DIR
            value: /etc/doorman-peer-ca:/etc/ssl/certs
        documentSelector:
          path: spec.template.spec.serviceAccountName
          value: test-kc-doorman
      - contains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            name: peer-ca
            mountPath: /etc/doorman-peer-ca
            readOnly: true
        documentSelector:
          path: spec.template.spec.serviceAccountName
          value: test-kc-doorman

  - it: trusts the CA ConfigMap named for the ring (config.ha.caConfigMapName) for the peer
    template: kinetica_operators.yaml
    set:
      doorman.ha.enabled: true
      doorman.ha.peer.host: ring-b-ha.example.com
      doorman.ha.readyCheck.secretName: ring-probe-auth
      kineticacluster.gpudbCluster.config.ha.caConfigMapName: ring-ca
    asserts:
      - contains:
          path: spec.template.spec.volumes
          content:
            name: peer-ca
            configMap:
              name: ring-ca
              items:
                - key: ca.crt
                  path: ca.crt
        documentSelector:
          path: spec.template.spec.serviceAccountName
          value: test-kc-doorman

  - it: mounts no peer CA without a peer
    template: kinetica_operators.yaml
    set:
      doorman.ha.enabled: true
    asserts:
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: SSL_CERT_DIR
          any: true
        documentSelector:
          path: spec.template.spec.serviceAccountName
          value: test-kc-doorman
      - notContains:
          path: spec.template.spec.volumes
          content:
            name: peer-ca
          any: true
        documentSelector:
          path: spec.template.spec.serviceAccountName
          value: test-kc-doorman
