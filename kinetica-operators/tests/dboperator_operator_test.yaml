suite: DB operator Deployment, Services, Webhooks, Certs
values:
  - __base_values.yaml

tests:
  - it: creates DB operator Deployment with correct image
    template: kinetica_operators.yaml
    asserts:
      - containsDocument:
          kind: Deployment
          apiVersion: apps/v1
          name: kineticaoperator-controller-manager
          any: true
      - equal:
          path: spec.template.spec.containers[0].image
          value: "test.registry.io/kinetica-k8s-operator:v0.0.1-test"
        documentSelector:
          path: metadata.name
          value: kineticaoperator-controller-manager

  - it: sets serviceAccountName on Deployment
    template: kinetica_operators.yaml
    asserts:
      - equal:
          path: spec.template.spec.serviceAccountName
          value: controller-manager
        documentSelector:
          path: metadata.name
          value: kineticaoperator-controller-manager

  - it: honors dbOperator.serviceAccountName override on the Deployment
    template: kinetica_operators.yaml
    set:
      dbOperator:
        serviceAccountName: kineticacluster-operator
    asserts:
      - equal:
          path: spec.template.spec.serviceAccountName
          value: kineticacluster-operator
        documentSelector:
          path: metadata.name
          value: kineticaoperator-controller-manager

  - it: keeps the immutable selector at control-plane only (upgrade compatibility)
    template: kinetica_operators.yaml
    asserts:
      - equal:
          path: spec.selector.matchLabels
          value:
            control-plane: controller-manager
        documentSelector:
          path: metadata.name
          value: kineticaoperator-controller-manager

  - it: wires the operator runtime — downward-API env, config mounts, config-map
    template: kinetica_operators.yaml
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: POD_NAMESPACE
            valueFrom:
              fieldRef:
                fieldPath: metadata.namespace
        documentSelector:
          path: metadata.name
          value: kineticaoperator-controller-manager
      - contains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            mountPath: /etc/config/
            name: gpudb-tmpl
        documentSelector:
          path: metadata.name
          value: kineticaoperator-controller-manager
      - contains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            mountPath: /etc/manager/manager-config
            name: kineticaoperator-config-map
        documentSelector:
          path: metadata.name
          value: kineticaoperator-controller-manager
      - containsDocument:
          kind: ConfigMap
          apiVersion: v1
          name: kineticaoperator-config-map
          any: true
      - isNotEmpty:
          path: data["kinetica_cluster_reconciler.yaml"]
        documentSelector:
          path: metadata.name
          value: kineticaoperator-config-map

  - it: pins numeric runAsUser so runAsNonRoot is verifiable against symbolic image USER
    template: kinetica_operators.yaml
    asserts:
      - equal:
          path: spec.template.spec.securityContext
          value:
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
            fsGroup: 65532
            seccompProfile:
              type: RuntimeDefault
        documentSelector:
          path: metadata.name
          value: kineticaoperator-controller-manager
      - equal:
          path: spec.template.spec.containers[0].securityContext
          value:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
            seccompProfile:
              type: RuntimeDefault
        documentSelector:
          path: metadata.name
          value: kineticaoperator-controller-manager

  - it: creates webhook Service on port 443
    template: kinetica_operators.yaml
    asserts:
      - containsDocument:
          kind: Service
          apiVersion: v1
          name: kineticaoperator-webhook-service
          any: true
      - equal:
          path: spec.ports[0].port
          value: 443
        documentSelector:
          path: metadata.name
          value: kineticaoperator-webhook-service

  - it: creates metrics Service on port 8443
    template: kinetica_operators.yaml
    asserts:
      - containsDocument:
          kind: Service
          apiVersion: v1
          name: kineticaoperator-controller-manager-metrics-service
          any: true
      - equal:
          path: spec.ports[0].port
          value: 8443
        documentSelector:
          path: metadata.name
          value: kineticaoperator-controller-manager-metrics-service

  - it: ships no cluster-scoped metrics RBAC by default (disallowed on Rubix)
    template: kinetica_operators.yaml
    asserts:
      - not: true
        containsDocument:
          kind: ClusterRole
          apiVersion: rbac.authorization.k8s.io/v1
          name: metrics-auth-role
          any: true
      - not: true
        containsDocument:
          kind: ClusterRoleBinding
          apiVersion: rbac.authorization.k8s.io/v1
          name: metrics-auth-rolebinding
          any: true

  - it: ships cluster-scoped metrics RBAC when metricsAuth is enabled
    template: kinetica_operators.yaml
    set:
      dbOperator.rbac.installClusterRoles.metricsAuth: true
    asserts:
      - containsDocument:
          kind: ClusterRole
          apiVersion: rbac.authorization.k8s.io/v1
          name: metrics-auth-role
          any: true
      - containsDocument:
          kind: ClusterRoleBinding
          apiVersion: rbac.authorization.k8s.io/v1
          name: metrics-auth-rolebinding
          any: true

  - it: creates self-signed Issuer
    template: kinetica_operators.yaml
    asserts:
      - containsDocument:
          kind: Issuer
          apiVersion: cert-manager.io/v1
          name: kineticaoperator-selfsigned-issuer
          any: true
      - exists:
          path: spec.selfSigned
        documentSelector:
          path: metadata.name
          value: kineticaoperator-selfsigned-issuer

  - it: creates metrics Certificate referencing selfsigned issuer
    template: kinetica_operators.yaml
    asserts:
      - equal:
          path: spec.issuerRef.name
          value: kineticaoperator-selfsigned-issuer
        documentSelector:
          path: metadata.name
          value: kineticaoperator-metrics-certs

  - it: creates serving Certificate referencing selfsigned issuer
    template: kinetica_operators.yaml
    asserts:
      - equal:
          path: spec.issuerRef.name
          value: kineticaoperator-selfsigned-issuer
        documentSelector:
          path: metadata.name
          value: kineticaoperator-serving-cert

  - it: MutatingWebhookConfiguration has cert-manager annotation
    template: kinetica_operators.yaml
    asserts:
      - isNotEmpty:
          path: metadata.annotations["cert-manager.io/inject-ca-from"]
        documentSelector:
          path: metadata.name
          value: kineticaoperator-mutating-webhook-configuration

  - it: ValidatingWebhookConfiguration has cert-manager annotation
    template: kinetica_operators.yaml
    asserts:
      - isNotEmpty:
          path: metadata.annotations["cert-manager.io/inject-ca-from"]
        documentSelector:
          path: metadata.name
          value: kineticaoperator-validating-webhook-configuration
