suite: WB operator Deployment, RBAC, ConfigMap
values:
  - __base_values.yaml

tests:
  - it: creates WB operator Deployment when installed
    template: kinetica_operators.yaml
    asserts:
      - containsDocument:
          kind: Deployment
          apiVersion: apps/v1
          name: workbench-operator-controller-manager
          any: true

  - it: creates WB operator ServiceAccount
    template: kinetica_operators.yaml
    asserts:
      - containsDocument:
          kind: ServiceAccount
          apiVersion: v1
          name: workbench-operator-service-account
          any: true

  - it: creates WB operator metrics Service
    template: kinetica_operators.yaml
    asserts:
      - containsDocument:
          kind: Service
          apiVersion: v1
          name: workbench-operator-controller-manager-metrics-service
          any: true

  - it: WB metrics Service targets the manager metrics port
    template: kinetica_operators.yaml
    documentSelector:
      path: metadata.name
      value: workbench-operator-controller-manager-metrics-service
    asserts:
      - equal:
          path: spec.ports[0].port
          value: 8443
      - equal:
          path: spec.ports[0].targetPort
          value: 8443

  - it: ships no cluster-scoped metrics RBAC by default (disallowed on Rubix)
    template: kinetica_operators.yaml
    asserts:
      - not: true
        containsDocument:
          kind: ClusterRole
          apiVersion: rbac.authorization.k8s.io/v1
          name: workbench-operator-metrics-auth-role
          any: true
      - not: true
        containsDocument:
          kind: ClusterRoleBinding
          apiVersion: rbac.authorization.k8s.io/v1
          name: workbench-operator-metrics-auth-rolebinding
          any: true

  - it: ships cluster-scoped metrics RBAC when metricsAuth is enabled
    template: kinetica_operators.yaml
    set:
      wbOperator.rbac.installClusterRoles.metricsAuth: true
    asserts:
      - containsDocument:
          kind: ClusterRole
          apiVersion: rbac.authorization.k8s.io/v1
          name: workbench-operator-metrics-auth-role
          any: true
      - containsDocument:
          kind: ClusterRoleBinding
          apiVersion: rbac.authorization.k8s.io/v1
          name: workbench-operator-metrics-auth-rolebinding
          any: true

  - it: WB operator pod runs the manager alone (no kube-rbac-proxy sidecar)
    template: kinetica_operators.yaml
    documentSelector:
      path: metadata.name
      value: workbench-operator-controller-manager
    asserts:
      - lengthEqual:
          path: spec.template.spec.containers
          count: 1
      - equal:
          path: spec.template.spec.containers[0].name
          value: manager

  - it: creates workbench-tmpl ConfigMap
    template: kinetica_operators.yaml
    asserts:
      - containsDocument:
          kind: ConfigMap
          apiVersion: v1
          name: workbench-tmpl
          any: true

  - it: creates WB manager Role in cluster namespace
    template: kinetica_operators.yaml
    asserts:
      - containsDocument:
          kind: Role
          apiVersion: rbac.authorization.k8s.io/v1
          name: workbench-operator-manager-role
          namespace: gpudb
          any: true

  - it: creates WB manager RoleBinding in cluster namespace
    template: kinetica_operators.yaml
    asserts:
      - containsDocument:
          kind: RoleBinding
          apiVersion: rbac.authorization.k8s.io/v1
          name: workbench-operator-manager-rolebinding
          namespace: gpudb
          any: true

  - it: creates WB leader election Role
    template: kinetica_operators.yaml
    asserts:
      - containsDocument:
          kind: Role
          apiVersion: rbac.authorization.k8s.io/v1
          name: workbench-operator-leader-election-role
          any: true

  - it: suppresses all WB resources when disabled
    template: kinetica_operators.yaml
    set:
      wbOperator.install: false
    asserts:
      - not: true
        containsDocument:
          kind: Deployment
          apiVersion: apps/v1
          name: workbench-operator-controller-manager
          any: true
      - not: true
        containsDocument:
          kind: ServiceAccount
          apiVersion: v1
          name: workbench-operator-service-account
          any: true
      - not: true
        containsDocument:
          kind: ConfigMap
          apiVersion: v1
          name: workbench-tmpl
          any: true

  - it: wb-only path still creates namespaces
    template: kinetica_operators.yaml
    set:
      dbOperator.install: false
      wbOperator.install: true
    asserts:
      - containsDocument:
          kind: Deployment
          apiVersion: apps/v1
          name: workbench-operator-controller-manager
          any: true
      - containsDocument:
          kind: Namespace
          apiVersion: v1
          name: gpudb
          any: true
