suite: the shipped HA example overlays render
values:
  - __base_values.yaml

tests:
  - it: renders a site with the CB Proxy
    values:
      - ../examples/ha-site-with-cb-proxy.yaml
    asserts:
      - equal:
          path: spec.gpudbCluster.config.ha.clusters[1].url
          value: https://site-b.example.com:8082/gpudb-0
        template: charts/kineticacluster/templates/kineticacluster.yaml
      - equal:
          path: spec.gpudbCluster.config.network.publicAddress
          value: https://site-a.example.com
        template: charts/kineticacluster/templates/kineticacluster.yaml
      - matchRegex:
          path: data["circuitbreaker.yaml"]
          pattern: "host: site-b.example.com"
        documentSelector:
          path: metadata.name
          value: site-a-doorman-config
        template: templates/kinetica_operators.yaml

  - it: renders a site without the CB Proxy
    values:
      - ../examples/ha-site-without-cb-proxy.yaml
    asserts:
      - equal:
          path: spec.gpudbCluster.config.ha.service.type
          value: LoadBalancer
        template: charts/kineticacluster/templates/kineticacluster.yaml
      - equal:
          path: spec.gpudbCluster.config.network.publicURLBase
          value: http://site-a.example.com:8082
        template: charts/kineticacluster/templates/kineticacluster.yaml
      - containsDocument:
          kind: ConfigMap
          apiVersion: v1
          name: site-a-doorman-config
          any: true
        not: true
        template: templates/kinetica_operators.yaml
