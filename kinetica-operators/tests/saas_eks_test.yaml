suite: saas/eks dispatch
values:
  - __base_values.yaml

tests:
  - it: renders for saas/eks with dbOperator enabled
    template: kinetica_operators.yaml
    set:
      environment: "saas"
      provider: "eks"
    asserts:
      - notFailedTemplate: {}

  - it: creates the DB operator Deployment and its config for saas/eks
    template: kinetica_operators.yaml
    set:
      environment: "saas"
      provider: "eks"
    asserts:
      - containsDocument:
          kind: Deployment
          apiVersion: apps/v1
          name: kineticaoperator-controller-manager
          any: true
      - containsDocument:
          kind: ConfigMap
          apiVersion: v1
          name: kineticaoperator-config-map
          any: true
      - containsDocument:
          kind: MutatingWebhookConfiguration
          apiVersion: admissionregistration.k8s.io/v1
          any: true

  - it: uses the webhook-free DB operator variant for saas/eks when webhooks are off
    template: kinetica_operators.yaml
    set:
      environment: "saas"
      provider: "eks"
      dbOperator:
        webhooks:
          install: false
    asserts:
      - containsDocument:
          kind: Deployment
          apiVersion: apps/v1
          name: kineticaoperator-controller-manager
          any: true
      - not: true
        containsDocument:
          kind: MutatingWebhookConfiguration
          apiVersion: admissionregistration.k8s.io/v1
          any: true

  - it: renders for saas/eks with dbOperator disabled
    template: kinetica_operators.yaml
    set:
      environment: "saas"
      provider: "eks"
      dbOperator.install: false
    asserts:
      - notFailedTemplate: {}

  - it: creates both ClusterIssuers unconditionally for saas-eks
    template: kinetica_operators.yaml
    set:
      environment: "saas"
      provider: "eks"
      dbOperator.install: false
    asserts:
      - containsDocument:
          kind: ClusterIssuer
          apiVersion: cert-manager.io/v1
          name: letsencrypt-production
          any: true
      - containsDocument:
          kind: ClusterIssuer
          apiVersion: cert-manager.io/v1
          name: letsencrypt-staging
          any: true

  - it: creates saas-eks namespaces via wb-only path
    template: kinetica_operators.yaml
    set:
      environment: "saas"
      provider: "eks"
      dbOperator.install: false
    asserts:
      - containsDocument:
          kind: Namespace
          apiVersion: v1
          name: gpudb
          any: true

  - it: creates WB operator for saas/eks
    template: kinetica_operators.yaml
    set:
      environment: "saas"
      provider: "eks"
      dbOperator.install: false
    asserts:
      - containsDocument:
          kind: Deployment
          apiVersion: apps/v1
          name: workbench-operator-controller-manager
          any: true
