
certManager:
  install: false

createNamespaces: false

dbOperator:
  webhooks:
    # No admission webhooks on Rubix: the helm-chart-operator SA has no
    # cert-manager.io or admissionregistration.k8s.io RBAC, so the webhook
    # stack (Issuer/Certificates/webhook configs) fails at apply. The operator
    # runs with ENABLE_WEBHOOKS=false; all handlers are scaffold stubs today,
    # so nothing is lost — CRD schema validation is unaffected.
    install: false

doorman:
  # Hard anti-affinity + replica spread: Rubix is multi-node, so keep doorman
  # replicas off DB nodes and never co-located with each other.
  avoidDBNodes: true
  # Tier-3 probe shielding on: survive DB outages longer than the JDBC
  # driver's probe patience — proven necessary by the 2026-07-15 controlled
  # suspend/resume tests (10-13 min outages survive on holds alone; ~20 min
  # kills the ingest via GPUdbExitException from failed status probes).
  holdShield:
    enabled: true
  install: true
  listener:
    # Parity with the previous ingress-nginx posture: no default-ssl-certificate
    # was configured, so nginx served its built-in self-signed cert and the
    # platform Envoy accepted it. selfSigned reproduces that with a chart-
    # generated cert; set tlsSecretName (e.g. the Rubix pod-cert secret
    # cert-<cluster>-doorman) to serve a managed certificate instead.
    selfSigned: true
  requireReplicaSpread: true
  service:
    annotations:
      com.palantir.rubix.service.spp/v3: |
        {

          "endpoints": [
            {
              "name": "https",
              "prefix": "{{ $n := .Values.global.kineticaClusterName }}{{ if and $n (ne $n "kineticacluster") }}/{{ $n }}{{ else }}/{{ end }}",
              "domain-aliases": ["DEFAULT"]
            }
          ]
        }
      com.palantir.rubix.service/pod-cert: '{}'

environment: onPrem

gpuOperator:
  install: false

# ingress-nginx is replaced by the static circuit-breaker "doorman" proxy

# (below). The Rubix SPP / pod-cert service annotations move to

# doorman.service.annotations so the platform Envoy routes to the proxy's

# Service instead. Gateway API mode and the circuit-breaker operator are NOT

# used on Rubix: cluster-wide RBAC is disallowed and the gateway-api CRDs on

# the cluster are platform-owned (helm may only create CRDs, never update).

ingressNginx:
  install: false

kineticacluster:
  # Internal identity provider: gpudb owns the credentials
  # (enable_httpd_proxy=false, enable_external_authentication=false — set by
  # the operator). No LDAP server is involved; ldap: null drops the inherited
  # in-cluster openldap connection block from the KineticaCluster CR.
  authentication:
    ldap: null
    type: Internal
  gpudbCluster:
    clusterName: kinetica-apollo-entity
    config:
      tieredStorage:
        globalTier:
          colocateDisks: true
        persistTier:
          default:
            limit: 50Gi
            volumeClaim:
              spec:
                accessModes:
                  - ReadWriteOnce
                storageClassName: null
    letsEncrypt:
      enabled: false
    publicTls: true
  install: true
  monitoring:
    syslog:
      enabled: false
  name: kinetica-apollo-entity

kubeRbacProxy:
  image:
    repository: kube-rbac-proxy
    tag: v0.22.0

kubeStateMetrics:
  install: false

networkPolicies:
  install: true

# No OpenLDAP on Rubix: users, roles and grants are managed natively in the

# database (kineticacluster.authentication.type=Internal below), so the bundled

# LDAP server and its pod-cert/persistence decoration are not deployed.

openldap:
  install: false

otelCollector:
  install: false
  installRbac: false

provider: kind

support-bundle:
  configMap:
    cluster: kinetica-apollo-entity

supportBundle:
  install: false

upsertKineticaCrds:
  enabled: true
  # Run the upsert Job as the pre-rename SA name: the platform-provisioned
  # CRD-update ClusterRoleBinding on Rubix names kineticacluster-operator as its
  # subject, and existing 1.0.179/1.0.180 installs already have the SA. The chart
  # creates it on fresh installs (pre-install hook in crds.upsert.tpl).
  serviceAccountName: kineticacluster-operator

workbench:
  # Must match kineticacluster.name above (the KineticaCluster metadata.name).
  clusterRef:
    name: kinetica-apollo-entity
  letsEncrypt:
    enabled: false
  secureNetwork: true
  storageClass: null
  useHttps: true
