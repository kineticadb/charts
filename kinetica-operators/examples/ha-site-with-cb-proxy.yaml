# Kafka HA ring, one site, reached through its CB Proxy (see "Two-site example" in README.md).
# Use on top of the platform values file, one helm install per site:
#   helm install ... -f values.<platform>.yaml -f examples/ha-site-with-cb-proxy.yaml
# For the other site swap site-a and site-b everywhere except the order of the clusters list.
# Secrets to create first in the database namespace (values never carry passwords or keys):
#   <clusterName>-internal-password-secret  key PASSWORD     same value on every site
#   <clusterName>-crypto-secret             key SECRET_KEY   same value on every site
#   site-tls                                TLS Secret for this site's name
#   cb-proxy-probe-auth                     key auth, value admin:<shared admin password>
#   ring-kafka-creds                        keys username, password (only when Kafka needs a login)
kineticacluster:
  name: site-a
  gpudbCluster:
    config:
      ha:
        enable: true
        clusters:
          - name: site-a
          - name: site-b
            url: https://site-b.example.com:8082/gpudb-0
        kafka:
          brokers:
            - host: kafka.example.com
              port: 9092
          # securityProtocol: SASL_SSL
          # saslMechanism: SCRAM-SHA-512
          # credentialsSecretName: ring-kafka-creds
        # caConfigMapName: ring-ca
        service:
          type: LoadBalancer
      network:
        publicAddress: https://site-a.example.com
        publicURLBase: https://site-a.example.com:8082
workbench:
  clusterRef:
    name: site-a
doorman:
  install: true
  listener:
    port: 8082
    tlsSecretName: site-tls
  service:
    type: LoadBalancer
  ha:
    enabled: true
    peer:
      host: site-b.example.com
      port: 8082
      transport: HTTPS
    readyCheck:
      secretName: cb-proxy-probe-auth
