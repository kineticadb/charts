# Kafka HA ring, one site, no CB Proxy (see "How clients connect" in README.md).
# Use on top of the platform values file, one helm install per site:
#   helm install ... -f values.<platform>.yaml -f examples/ha-site-without-cb-proxy.yaml
# For the other site swap site-a and site-b everywhere except the order of the clusters list.
# The site is reached on the load balancer of <clusterName>-ha-service, port 8082, plain HTTP.
# Give every client all site addresses; clients fail over by themselves.
# Secrets to create first in the database namespace (values never carry passwords or keys):
#   <clusterName>-internal-password-secret  key PASSWORD     same value on every site
#   <clusterName>-crypto-secret             key SECRET_KEY   same value on every site
#   ring-kafka-creds                        keys username, password (only when Kafka needs a login)
kineticacluster:
  name: site-a
  gpudbCluster:
    config:
      ha:
        enable: true
        clusters:
          - name: site-a
          - name: site-b
            url: http://site-b.example.com:8082/gpudb-0
        kafka:
          brokers:
            - host: kafka.example.com
              port: 9092
          # securityProtocol: SASL_SSL
          # saslMechanism: SCRAM-SHA-512
          # credentialsSecretName: ring-kafka-creds
        service:
          type: LoadBalancer
      network:
        publicAddress: http://site-a.example.com
        publicURLBase: http://site-a.example.com:8082
workbench:
  clusterRef:
    name: site-a
doorman:
  install: false
